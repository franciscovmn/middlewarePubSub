# Ambiente dos ensaios: brokers A e B em contêineres separados, com rede,
# CPU e memória próprias, e duas sondas de controle. Os valores entre ${}
# podem vir do ambiente ou de um arquivo .env (veja scripts/ensaio.env).
#
# Em cada contêiner as portas internas são as do documento (7000/TCP de
# comandos, 7001/UDP de eventos, 7002/TCP entre brokers). As portas
# publicadas no host são parametrizáveis, para clientes de carga rodando
# fora do Docker.

x-broker: &broker
  image: ${IMAGEM:-pubsub-middleware:ensaio}
  cap_add: [NET_ADMIN]
  restart: "no"
  stop_grace_period: 3s
  volumes:
    - ./${CREDENCIAIS:-config/credentials.ensaio.json}:/etc/pubsub/credentials.json:ro
  networks: [pubsub]

x-sonda: &sonda
  image: ${IMAGEM:-pubsub-middleware:ensaio}
  cap_add: [NET_ADMIN]
  restart: "no"
  networks: [pubsub]
  depends_on: [a, b]

# Aplicação do leilão com o plano de dados UDP. Só sobe com o perfil
# "leilao" (docker compose --profile leilao up).
x-leilao: &leilao
  image: ${IMAGEM:-pubsub-middleware:ensaio}
  cap_add: [NET_ADMIN]
  restart: "no"
  networks: [pubsub]
  depends_on: [a, b]
  profiles: [leilao]

services:
  a:
    <<: *broker
    build: .
    hostname: a
    command:
      - broker
      - -id=A
      - -listen=:7000
      - -udp-port=7001
      - -memoria-max-bytes=${MEMORIA_MAX_BYTES:-201326592}
      - -distribuicao-por-segundo=${DISTRIBUICAO:-320}
      - -distribuicao-rajada=${DISTRIBUICAO_RAJADA:-320}
      - -credentials=/etc/pubsub/credentials.json
      - -peer-id=B
      - -peer-admin
      - -peer-addr=b:7002
      - -peer-token=${TOKEN_PAR:-ensaio-par}
      - -log-format=${LOG_FORMATO:-text}
      - -log-level=${LOG_NIVEL:-info}
    ports:
      - "${A_PORTA_TCP:-7000}:7000/tcp"
      - "${A_PORTA_UDP:-7001}:7001/udp"
    cpus: ${A_CPUS:-1}
    mem_limit: ${A_MEMORIA:-256m}

  b:
    <<: *broker
    hostname: b
    command:
      - broker
      - -id=B
      - -listen=:7000
      - -udp-port=7001
      - -memoria-max-bytes=${MEMORIA_MAX_BYTES:-201326592}
      - -distribuicao-por-segundo=${DISTRIBUICAO:-320}
      - -distribuicao-rajada=${DISTRIBUICAO_RAJADA:-320}
      - -credentials=/etc/pubsub/credentials.json
      - -peer-id=A
      - -peer-listen=:7002
      - -peer-token=${TOKEN_PAR:-ensaio-par}
      - -log-format=${LOG_FORMATO:-text}
      - -log-level=${LOG_NIVEL:-info}
    ports:
      - "${B_PORTA_TCP:-7100}:7000/tcp"
      - "${B_PORTA_UDP:-7101}:7001/udp"
    cpus: ${B_CPUS:-1}
    mem_limit: ${B_MEMORIA:-256m}

  # Prefere o A e passa ao B em caso de falha.
  sonda-a:
    <<: *sonda
    hostname: sonda-a
    environment:
      SONDA_BROKERS: a:7000,b:7000
      SONDA_ID: sonda-a
      SONDA_TOKEN: ensaio-sonda-a
    command:
      - sonda
      - observar
      - -topicos=${TOPICOS:-sala-1/lances,sala-1/reacoes,sala-1/placar=estado}
      - -silencio=${SILENCIO:-5s}
      - -log-format=${LOG_FORMATO:-text}
      - -log-level=${LOG_NIVEL:-info}

  # Prefere o B e passa ao A em caso de falha.
  sonda-b:
    <<: *sonda
    hostname: sonda-b
    environment:
      SONDA_BROKERS: b:7000,a:7000
      SONDA_ID: sonda-b
      SONDA_TOKEN: ensaio-sonda-b
    command:
      - sonda
      - observar
      - -topicos=${TOPICOS:-sala-1/lances,sala-1/reacoes,sala-1/placar=estado}
      - -silencio=${SILENCIO:-5s}
      - -log-format=${LOG_FORMATO:-text}
      - -log-level=${LOG_NIVEL:-info}

  # Leiloeiro no A: cria a sala, acompanha os lances e publica o placar.
  leiloeiro:
    <<: *leilao
    hostname: leiloeiro
    environment:
      LEILAO_BROKERS: a:7000,b:7000
      LEILAO_ID: leiloeiro
      LEILAO_TOKEN: ensaio-leiloeiro
      LEILAO_SALA: ${SALA:-sala-1}
    command:
      - leilao
      - leiloeiro
      - -criar
      - -placar=${PLACAR:-100ms}
      - -resumo=${RESUMO:-2s}
      - -silencio=${SILENCIO:-5s}
      - -log-format=${LOG_FORMATO:-text}
      - -log-level=${LOG_NIVEL:-info}

  participante-1:
    <<: *leilao
    hostname: participante-1
    environment:
      LEILAO_BROKERS: a:7000,b:7000
      LEILAO_ID: participante-1
      LEILAO_TOKEN: ensaio-participante-1
      LEILAO_SALA: ${SALA:-sala-1}
    command: &participante
      - leilao
      - participante
      - -lances=${LANCES:-5}
      - -reacoes=${REACOES:-5}
      - -rajada=${RAJADA:-10}
      - -rajada-cada=${RAJADA_CADA:-10s}
      - -duracao=${DURACAO:-0}
      - -resumo=${RESUMO:-2s}
      - -silencio=${SILENCIO:-5s}
      - -log-format=${LOG_FORMATO:-text}
      - -log-level=${LOG_NIVEL:-info}

  participante-2:
    <<: *leilao
    hostname: participante-2
    environment:
      LEILAO_BROKERS: b:7000,a:7000
      LEILAO_ID: participante-2
      LEILAO_TOKEN: ensaio-participante-2
      LEILAO_SALA: ${SALA:-sala-1}
    command: *participante

  # Participantes adicionais permitem medir justiça entre publicadores sem
  # reutilizar identidade/sessão. Alterne a preferência A/B nos ensaios.
  participante-3:
    <<: *leilao
    hostname: participante-3
    environment: {LEILAO_BROKERS: "a:7000,b:7000", LEILAO_ID: participante-3, LEILAO_TOKEN: ensaio-participante-3, LEILAO_SALA: "${SALA:-sala-1}"}
    command: *participante
  participante-4:
    <<: *leilao
    hostname: participante-4
    environment: {LEILAO_BROKERS: "b:7000,a:7000", LEILAO_ID: participante-4, LEILAO_TOKEN: ensaio-participante-4, LEILAO_SALA: "${SALA:-sala-1}"}
    command: *participante
  participante-5:
    <<: *leilao
    hostname: participante-5
    environment: {LEILAO_BROKERS: "a:7000,b:7000", LEILAO_ID: participante-5, LEILAO_TOKEN: ensaio-participante-5, LEILAO_SALA: "${SALA:-sala-1}"}
    command: *participante
  participante-6:
    <<: *leilao
    hostname: participante-6
    environment: {LEILAO_BROKERS: "b:7000,a:7000", LEILAO_ID: participante-6, LEILAO_TOKEN: ensaio-participante-6, LEILAO_SALA: "${SALA:-sala-1}"}
    command: *participante
  participante-7:
    <<: *leilao
    hostname: participante-7
    environment: {LEILAO_BROKERS: "a:7000,b:7000", LEILAO_ID: participante-7, LEILAO_TOKEN: ensaio-participante-7, LEILAO_SALA: "${SALA:-sala-1}"}
    command: *participante
  participante-8:
    <<: *leilao
    hostname: participante-8
    environment: {LEILAO_BROKERS: "b:7000,a:7000", LEILAO_ID: participante-8, LEILAO_TOKEN: ensaio-participante-8, LEILAO_SALA: "${SALA:-sala-1}"}
    command: *participante

  espectador-a:
    <<: *leilao
    hostname: espectador-a
    environment:
      LEILAO_BROKERS: a:7000,b:7000
      LEILAO_ID: espectador-a
      LEILAO_TOKEN: ensaio-espectador-a
      LEILAO_SALA: ${SALA:-sala-1}
    command: &espectador
      - leilao
      - espectador
      - -resumo=${RESUMO:-2s}
      - -processamento=${ATRASO_CONSUMIDOR:-0}
      - -silencio=${SILENCIO:-5s}
      - -log-format=${LOG_FORMATO:-text}
      - -log-level=${LOG_NIVEL:-info}

  espectador-b:
    <<: *leilao
    hostname: espectador-b
    environment:
      LEILAO_BROKERS: b:7000,a:7000
      LEILAO_ID: espectador-b
      LEILAO_TOKEN: ensaio-espectador-b
      LEILAO_SALA: ${SALA:-sala-1}
    command: *espectador

networks:
  pubsub:
    driver: bridge
